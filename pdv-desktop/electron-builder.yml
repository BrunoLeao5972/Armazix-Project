appId: br.com.armazix.pdv
productName: Armazix PDV
directories:
  buildResources: build
  output: release
files:
  - out/**/*
  - package.json
asarUnpack:
  - resources/**

win:
  target:
    - target: nsis
      arch:
        - x64
  # Ícone de verdade entra em build/icon.ico antes do primeiro release — sem
  # ele o electron-builder usa o ícone padrão do Electron.
  icon: build/icon.ico

nsis:
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false
  deleteAppDataOnUninstall: false
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Armazix PDV

publish: null
